name: Build AniKatha
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Shared UI and storage checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/AniKatha.Preview/AniKatha.Preview.csproj -c Release
      - run: dotnet run --project tests/AniKatha.Checks -c Release
  android:
    name: Android debug APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet build src/AniKatha.Mobile/AniKatha.Mobile.csproj -c Debug -f net10.0-android
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-android-debug
          path: src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error

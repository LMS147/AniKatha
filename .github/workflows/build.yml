name: Build AniKatha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Shared UI and storage checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/AniKatha.Preview/AniKatha.Preview.csproj -c Release
      - run: dotnet run --project tests/AniKatha.Checks -c Release
      - run: dotnet run --project tests/AniKatha.UiChecks -c Release
        env:
          ANIKATHA_TRACKING_CAPTURE_DIRECTORY: ${{ runner.temp }}/tracking-ui
          ANIKATHA_HOME_CAPTURE_DIRECTORY: ${{ runner.temp }}/home-ui
          ANIKATHA_LIBRARY_CAPTURE_DIRECTORY: ${{ runner.temp }}/library-ui
          ANIKATHA_PROFILE_CAPTURE_DIRECTORY: ${{ runner.temp }}/profile-ui
      - name: Capture the connected and pending tracking fixtures
        shell: bash
        run: |
          mkdir -p artifacts/tracking-ui
          cp src/AniKatha.UI/wwwroot/app.css "$RUNNER_TEMP/tracking-ui/"
          cp -R src/AniKatha.UI/wwwroot/fonts "$RUNNER_TEMP/tracking-ui/"
          for name in anilist-disconnected anilist-connected anilist-editor anilist-pending; do
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=420,930 --user-data-dir="$RUNNER_TEMP/chrome-$name" \
              --screenshot="$PWD/artifacts/tracking-ui/$name.png" \
              "file://$RUNNER_TEMP/tracking-ui/$name.html"
            test -s "artifacts/tracking-ui/$name.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-tracking-fixture-screenshots
          path: artifacts/tracking-ui
          if-no-files-found: error
      - name: Capture the five Library views
        shell: bash
        run: |
          mkdir -p artifacts/library-ui "$RUNNER_TEMP/library-ui/art"
          cp src/AniKatha.UI/wwwroot/app.css "$RUNNER_TEMP/library-ui/"
          cp -R src/AniKatha.UI/wwwroot/fonts "$RUNNER_TEMP/library-ui/"
          cp src/AniKatha.UI/wwwroot/manga/*.webp "$RUNNER_TEMP/library-ui/art/"
          for name in overview anime-list manga-list anime-stats manga-stats; do
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,884 --user-data-dir="$RUNNER_TEMP/library-chrome-$name" \
              --screenshot="$PWD/artifacts/library-ui/$name.png" \
              "file://$RUNNER_TEMP/library-ui/$name.html"
            test -s "artifacts/library-ui/$name.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-Library-screenshots
          path: artifacts/library-ui
          if-no-files-found: error
      - name: Capture the four Profile tabs
        shell: bash
        run: |
          mkdir -p artifacts/profile-ui
          cp src/AniKatha.UI/wwwroot/app.css "$RUNNER_TEMP/profile-ui/"
          cp -R src/AniKatha.UI/wwwroot/fonts "$RUNNER_TEMP/profile-ui/"
          cp "$RUNNER_TEMP/tracking-ui/profile-sync-connected.html" "$RUNNER_TEMP/profile-ui/sync-connected.html"
          for name in account preferences sync security sync-connected; do
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,884 --user-data-dir="$RUNNER_TEMP/profile-chrome-$name" \
              --screenshot="$PWD/artifacts/profile-ui/$name.png" \
              "file://$RUNNER_TEMP/profile-ui/$name.html"
            test -s "artifacts/profile-ui/$name.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-Profile-screenshots
          path: artifacts/profile-ui
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare Home at three mobile widths
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/home-ui/art"
          cp src/AniKatha.UI/wwwroot/app.css "$RUNNER_TEMP/home-ui/"
          cp -R src/AniKatha.UI/wwwroot/fonts "$RUNNER_TEMP/home-ui/"
          cp src/AniKatha.UI/wwwroot/manga/*.webp "$RUNNER_TEMP/home-ui/art/"
          node scripts/capture_home_layout.mjs "$RUNNER_TEMP/home-ui" artifacts/home-ui/updated
          if [[ -n "$BASE_COMMIT" ]]; then
            git fetch --depth=1 origin "$BASE_COMMIT"
            git worktree add --detach "$RUNNER_TEMP/home-baseline" FETCH_HEAD
            mkdir -p "$RUNNER_TEMP/home-before/art"
            cp "$RUNNER_TEMP/home-baseline/src/AniKatha.UI/wwwroot/app.css" "$RUNNER_TEMP/home-before/"
            cp "$RUNNER_TEMP/home-ui/art/"*.webp "$RUNNER_TEMP/home-before/art/"
            ANIKATHA_HOME_CAPTURE_DIRECTORY="$RUNNER_TEMP/home-before" dotnet run --project "$RUNNER_TEMP/home-baseline/tests/AniKatha.UiChecks" -c Release
            node scripts/capture_home_layout.mjs "$RUNNER_TEMP/home-before" artifacts/home-ui/baseline baseline
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniKatha-Home-mobile-comparison
          path: artifacts/home-ui
          if-no-files-found: warn
      - run: python scripts/test_startup_checks.py
      - run: node --test scripts/*.test.mjs
  android:
    name: Android debug APK
    runs-on: windows-latest
    outputs:
      anilist-configured: ${{ steps.android-build.outputs.anilist-configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - name: Build Android APK
        id: android-build
        shell: pwsh
        env:
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: |
          $clientId = "$env:ANILIST_CLIENT_ID".Trim()
          $buildArgs = @('build', 'src/AniKatha.Mobile/AniKatha.Mobile.csproj', '-c', 'Debug', '-f', 'net10.0-android')
          $configured = 'false'
          if ($clientId) {
            $parsedId = 0
            if ($clientId -cnotmatch '^[0-9]+$' -or -not [int]::TryParse($clientId, [ref]$parsedId) -or $parsedId -le 0) {
              throw 'ANILIST_CLIENT_ID must be a positive integer from AniList developer settings.'
            }
            $buildArgs += "-p:AniListClientId=$clientId"
            $configured = 'true'
          }
          dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "anilist-configured=$configured" >> $env:GITHUB_OUTPUT
      - name: Check standalone APK contents
        shell: pwsh
        run: |
          $apk = Get-ChildItem src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk | Select-Object -First 1
          python scripts/check_apk.py $apk.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniKatha-android-debug
          path: src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error
      - name: Build the pre-roadmap APK for an in-place upgrade check
        shell: pwsh
        run: |
          git fetch --depth=1 origin 2f1a2e455c40f2399c428e695f9bb24ad749d867
          git worktree add --detach "$env:RUNNER_TEMP/anikatha-baseline" FETCH_HEAD
          dotnet build "$env:RUNNER_TEMP/anikatha-baseline/src/AniKatha.Mobile/AniKatha.Mobile.csproj" -c Debug -f net10.0-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/apk-baseline
          Copy-Item "$env:RUNNER_TEMP/anikatha-baseline/src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk" artifacts/apk-baseline/
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-upgrade-baseline
          path: artifacts/apk-baseline/*-Signed.apk
          if-no-files-found: error

  android-startup:
    name: Android installed APK startup (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AniKatha-android-debug
          path: artifacts/apk
      - uses: actions/download-artifact@v4
        with:
          name: AniKatha-upgrade-baseline
          path: artifacts/apk-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the downloadable APK
        env:
          ANIKATHA_STARTUP_MODE: ${{ matrix.mode }}
          ANIKATHA_TEST_ANILIST_CONFIGURED: ${{ needs.android.outputs.anilist-configured }}
          ANIKATHA_TEST_FIXTURE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android_startup.sh
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics-${{ matrix.mode }}
          path: artifacts/startup
          if-no-files-found: warn

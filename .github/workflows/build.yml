name: Build AniKatha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Shared UI and storage checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/AniKatha.Preview/AniKatha.Preview.csproj -c Release
      - run: dotnet run --project tests/AniKatha.Checks -c Release
      - run: dotnet run --project tests/AniKatha.UiChecks -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/test_startup_checks.py
      - run: node --test scripts/*.test.mjs
  android:
    name: Android debug APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet build src/AniKatha.Mobile/AniKatha.Mobile.csproj -c Debug -f net10.0-android
      - name: Check standalone APK contents
        shell: pwsh
        run: |
          $apk = Get-ChildItem src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk | Select-Object -First 1
          python scripts/check_apk.py $apk.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniKatha-android-debug
          path: src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error
      - name: Build the pre-roadmap APK for an in-place upgrade check
        shell: pwsh
        run: |
          git fetch --depth=1 origin 2f1a2e455c40f2399c428e695f9bb24ad749d867
          git worktree add --detach "$env:RUNNER_TEMP/anikatha-baseline" FETCH_HEAD
          dotnet build "$env:RUNNER_TEMP/anikatha-baseline/src/AniKatha.Mobile/AniKatha.Mobile.csproj" -c Debug -f net10.0-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/apk-baseline
          Copy-Item "$env:RUNNER_TEMP/anikatha-baseline/src/AniKatha.Mobile/bin/Debug/net10.0-android/*-Signed.apk" artifacts/apk-baseline/
      - uses: actions/upload-artifact@v4
        with:
          name: AniKatha-upgrade-baseline
          path: artifacts/apk-baseline/*-Signed.apk
          if-no-files-found: error

  android-startup:
    name: Android installed APK startup (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AniKatha-android-debug
          path: artifacts/apk
      - uses: actions/download-artifact@v4
        with:
          name: AniKatha-upgrade-baseline
          path: artifacts/apk-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the downloadable APK
        env:
          ANIKATHA_STARTUP_MODE: ${{ matrix.mode }}
          ANIKATHA_TEST_FIXTURE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android_startup.sh
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics-${{ matrix.mode }}
          path: artifacts/startup
          if-no-files-found: warn
